name: 'Core / Auth'
description: ''
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/core/auth/register
    metadata:
      custom: []
      groupName: 'Core / Auth'
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: Register
      description: |-
        Create an account with a mobile number or email address (at least one is required).
        Issues a verification code to whichever identifier was provided and returns an API token
        immediately — the account can authenticate right away, but protected endpoints stay
        gated behind `account.verified` until the code is confirmed via POST .../auth/verify.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      name:
        custom: []
        name: name
        description: 'Full name.'
        required: true
        example: 'Ahmed Al-Otaibi'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      email:
        custom: []
        name: email
        description: 'Email address. Required if mobile is omitted.'
        required: false
        example: ahmed@example.com
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      mobile:
        custom: []
        name: mobile
        description: 'Mobile number. Required if email is omitted.'
        required: false
        example: '+966501234567'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      password:
        custom: []
        name: password
        description: 'Min 8 chars, mixed case, numbers.'
        required: true
        example: Secr3tPass
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      terms_accepted:
        custom: []
        name: terms_accepted
        description: 'Must be true.'
        required: true
        example: true
        type: boolean
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password_confirmation:
        custom: []
        name: password_confirmation
        description: ''
        required: true
        example: Secr3tPass
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      name: 'Ahmed Al-Otaibi'
      email: ahmed@example.com
      mobile: '+966501234567'
      password: Secr3tPass
      terms_accepted: true
      password_confirmation: Secr3tPass
    fileParameters: []
    responses:
      -
        custom: []
        status: 201
        content: '{"data": {"user": {"id": 1, "name": "Ahmed Al-Otaibi", "email": "ahmed@example.com", "mobile": null, "email_verified": false, "mobile_verified": false, "status": "active"}, "token": "1|abcdef..."}}'
        headers: []
        description: success
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
